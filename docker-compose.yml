services:
  postgres:
    image: postgres:16-alpine
    container_name: certificate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certificate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend_net:
        aliases:
          - db
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d certificate_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certificate_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/certificate_db
      - STORAGE_PATH=/app/storage/certificates
      - MAX_RECIPIENTS_PER_JOB=1000
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    networks:
      - backend_net

volumes:
  postgres_data:
    driver: local

networks:
  backend_net:
    driver: bridge
